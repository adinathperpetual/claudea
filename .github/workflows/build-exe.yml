name: Build Windows exe

on:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "finesse_sync/**"
      - "index.html"
      - ".env.example"
      - "requirements.txt"
      - "packaging/**"
      - "BUILD_EXE.bat"
      - "START_HERE.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: python packaging/exe/build_exe.py
      - name: Smoke test
        shell: pwsh
        run: |
          & "dist/exe/ContractNoteExtractor/ContractNoteExtractor.exe" genkey
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ContractNoteExtractor-exe
          path: dist/exe/
          retention-days: 30
      - name: Source zips
        run: python packaging/make_zips.py
      - name: Publish on the "latest" download page (GitHub Release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest
          NOTES="Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d).
          ContractNoteExtractor-exe.zip = Windows program, no Python needed (unzip, double-click ContractNoteExtractor.exe).
          ContractNoteExtractor.zip = Python version (SETUP.bat, START.bat).
          ContractNoteExtractor-exe-build-kit.zip = BUILD_EXE.bat and what it needs to build the .exe yourself."
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Contract Note Extractor - latest" --notes "$NOTES" \
            dist/ContractNoteExtractor-exe.zip dist/ContractNoteExtractor.zip dist/ContractNoteExtractor-exe-build-kit.zip
